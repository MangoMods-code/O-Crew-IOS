name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: |
          curl -sSL -o xcodegen.zip https://github.com/yonaskolb/XcodeGen/releases/latest/download/xcodegen.zip
          unzip -q xcodegen.zip -d xcodegen-dist
          echo "$PWD/xcodegen-dist/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Generate Xcode project
        run: xcodegen generate

      # Every build gets its own version (0.1.<run>, build <run>) so app installers/signers
      # see each IPA as a new update instead of "this version is already uploaded".
      - name: Set version
        run: |
          echo "APP_VERSION=0.1.${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "APP_BUILD=${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild -version
          xcodebuild \
            -project OCrew.xcodeproj \
            -target OCrew \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build" \
            MARKETING_VERSION="$APP_VERSION" CURRENT_PROJECT_VERSION="$APP_BUILD" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log | grep -E "error:|warning: unre|BUILD (SUCCEEDED|FAILED)" || true
          if ! grep -q "BUILD SUCCEEDED" build.log || [ ! -f build/Release-iphoneos/OCrew.app/OCrew ]; then
            echo "::group::Errors"; grep -E "error:" build.log | sort -u | head -150; echo "::endgroup::"
            exit 1
          fi

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/OCrew.app Payload/
          zip -qry O-Crew.ipa Payload
          ls -lh O-Crew.ipa
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Payload/OCrew.app/Info.plist
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" Payload/OCrew.app/Info.plist

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: O-Crew-ipa
          path: O-Crew.ipa

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: O-Crew ${{ env.APP_VERSION }}
          body_path: RELEASE_NOTES.md
          files: O-Crew.ipa
          make_latest: true
